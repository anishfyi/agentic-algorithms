[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "agentic-algorithms"
version = "0.1.0"
description = "Algorithms, patterns, and reference implementations for building agentic systems"
readme = "README.md"
requires-python = ">=3.12"
license = { text = "MIT" }
authors = [{ name = "Anish", email = "anishfyi@gmail.com" }]
keywords = [
  "agents",
  "llm",
  "react",
  "multi-agent",
  "fintech",
  "tool-use",
  "evaluation",
]
classifiers = [
  "Development Status :: 4 - Beta",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Scientific/Engineering :: Artificial Intelligence",
  "Topic :: Software Development :: Libraries :: Python Modules",
]
dependencies = [
  "pydantic>=2.7",
  "typing-extensions>=4.12",
]

[project.optional-dependencies]
anthropic = ["anthropic>=0.40"]
openai = ["openai>=1.50"]
all = ["agentic-algorithms[anthropic,openai]"]
dev = [
  "agentic-algorithms[all]",
  "pytest>=8.0",
  "pytest-asyncio>=0.24",
  "pytest-cov>=5.0",
  "ruff>=0.8",
  "mypy>=1.13",
  "build>=1.0",
  "twine>=5.0",
]

[project.urls]
Homepage = "https://github.com/anishfyi/agentic-algorithms"
Documentation = "https://github.com/anishfyi/agentic-algorithms#readme"
Repository = "https://github.com/anishfyi/agentic-algorithms"
Issues = "https://github.com/anishfyi/agentic-algorithms/issues"

[tool.hatch.build.targets.wheel]
packages = ["src/agentic_algorithms"]

[tool.hatch.build.targets.sdist]
only-include = ["src/agentic_algorithms", "README.md", "LICENSE", "examples"]

[tool.ruff]
target-version = "py312"
line-length = 100
src = ["src", "tests", "examples"]

[tool.ruff.lint]
select = [
  "E",
  "F",
  "I",
  "UP",
  "B",
  "SIM",
  "RUF",
]

[tool.ruff.lint.isort]
known-first-party = ["agentic_algorithms"]

[tool.ruff.lint.per-file-ignores]
"src/agentic_algorithms/__init__.py" = ["F401"]
"src/agentic_algorithms/dsa/__init__.py" = ["RUF022"]

[tool.mypy]
python_version = "3.12"
strict = true
warn_return_any = true
warn_unused_configs = true
packages = ["agentic_algorithms"]
mypy_path = "src"

[[tool.mypy.overrides]]
module = ["anthropic.*", "openai.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
addopts = "-q --strict-markers"

[tool.coverage.run]
source = ["agentic_algorithms"]
branch = true

[tool.coverage.report]
fail_under = 80
show_missing = true
skip_covered = true
