name: pages

on:
  push:
    branches: [main]
    paths:
      - "web/**"
      - "catalogs/**"
      - "scripts/build_algorithm_catalog.py"
      - "scripts/build_shopify_knowledge.py"
      - ".github/workflows/pages.yml"
  workflow_dispatch:

permissions:
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Build algorithm catalog
        run: python scripts/build_algorithm_catalog.py
      # shopify_commerce.json is committed from curl_reap corpus; do not overwrite in CI.
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: web

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
